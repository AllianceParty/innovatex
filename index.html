<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InnovateX</title>
    <link rel="icon" href="Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #040609;
            --aero-glass-bg: rgba(14, 18, 28, 0.78);
            --aero-glass-surface: rgba(255, 255, 255, 0.05);
            --aero-glass-border: rgba(6, 182, 212, 0.4);
            --aero-glass-shine: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(6, 182, 212, 0) 100%);
            
            --primary-accent: #06b6d4;   
            --secondary-accent: #ef4444; 
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;

            --radius-main: 8px;
            --radius-btn: 4px;
            --radius-panels: 12px;

            /* Apple-grade smooth deceleration curve */
            --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);

            --binary-blitz-accent: #06b6d4;  
            --canvas-clash-accent: #f59e0b;  
            --scene-sync-accent: #ef4444;    
            --capital-core-accent: #10b981;  
        }

        @media (pointer: fine) {
            *, *::before, *::after {
                cursor: none !important;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Smooth Apple-grade Cursor */
        #customCursor {
            position: fixed; top: 0; left: 0;
            width: 28px; height: 28px;
            border: 2px solid var(--primary-accent);
            background: rgba(6, 182, 212, 0.06);
            border-radius: 50%;
            pointer-events: none;
            transform: translate3d(-50%, -50%, 0);
            transition: width 0.3s var(--apple-ease), 
                        height 0.3s var(--apple-ease), 
                        border-color 0.2s ease, background-color 0.2s ease;
            z-index: 9999999;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
        }
        #customCursorDot {
            position: fixed; top: 0; left: 0;
            width: 6px; height: 6px;
            background: var(--secondary-accent); 
            border-radius: 50%;
            pointer-events: none;
            transform: translate3d(-50%, -50%, 0);
            z-index: 10000000;
            box-shadow: 0 0 8px var(--secondary-accent);
        }
        body.cursor-hover #customCursor {
            width: 42px; height: 42px;
            border-color: var(--secondary-accent);
            background: rgba(239, 68, 68, 0.12);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.5);
        }
        
        body.booting #customCursor, 
        body.booting #customCursorDot {
            display: none !important;
        }

        @media (pointer: coarse) {
            #customCursor, #customCursorDot { display: none !important; }
            * { cursor: auto !important; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(10, 15, 30, 0.5); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-accent); border-radius: 8px; }

        #bootScreen {
            position: fixed; inset: 0; background: #020305; z-index: 999999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.6s var(--apple-ease), visibility 0.6s var(--apple-ease);
        }
        #bootScreen.fade-out { opacity: 0; visibility: hidden; }
        
        .boot-spinner {
            width: 46px; height: 46px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top-color: var(--primary-accent); border-right-color: var(--secondary-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .boot-title {
            font-size: 1.15rem; font-weight: 700; letter-spacing: 2.5px;
            color: var(--text-primary); text-shadow: 0 0 20px var(--primary-accent);
            animation: pulseText 1.4s ease-in-out infinite alternate;
        }
        @keyframes pulseText { from { opacity: 0.6; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }

        #wallpaperCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 1; pointer-events: auto;
        }

        #workspace {
            position: relative; width: 100vw; height: 100dvh; z-index: 2; overflow: hidden; pointer-events: none;
        }
        #workspace > * { pointer-events: auto; }

        .wallpaper-logo-mount {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 210px; height: 280px; background: var(--aero-glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--aero-glass-border); border-radius: var(--radius-panels);
            z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 3px rgba(255, 255, 255, 0.2);
            transition: transform 0.4s var(--apple-ease), box-shadow 0.4s var(--apple-ease);
        }
        .wallpaper-logo-mount:hover {
            transform: translateY(calc(-50% - 4px)) scale(1.015);
            box-shadow: 0 28px 65px rgba(0, 0, 0, 0.8), 0 0 22px rgba(6, 182, 212, 0.25);
        }
        .wallpaper-logo-mount::before {
            content: ''; position: absolute; inset: 0; border-radius: var(--radius-panels);
            background: var(--aero-glass-shine); pointer-events: none;
        }
        .wallpaper-logo-mount.left { left: 35px; }
        .wallpaper-logo-mount.right { right: 35px; }

        .logo-slot {
            width: 105px; height: 105px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-bottom: 16px; position: relative;
        }
        .logo-slot img {
            width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6));
            transition: transform 0.3s var(--apple-ease);
        }
        .logo-slot:hover img { transform: scale(1.06); }
        .logo-slot i {
            font-size: 2.5rem; color: var(--primary-accent); filter: drop-shadow(0 0 15px var(--primary-accent));
        }
        .logo-label {
            font-size: 0.88rem; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); text-align: center;
        }
        .logo-subtext { font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px; text-align: center; }

        #dynamicIsland {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 500px; height: 60px; background: var(--aero-glass-bg);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--aero-glass-border); border-radius: var(--radius-panels);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 1000; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.25);
            transition: opacity 0.4s var(--apple-ease), transform 0.4s var(--apple-ease);
        }
        #dynamicIsland::before {
            content: ''; position: absolute; inset: 0; border-radius: var(--radius-panels);
            background: var(--aero-glass-shine); pointer-events: none;
        }
        .island-section { display: flex; align-items: center; gap: 12px; z-index: 2; }
        .island-logo-slot { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .island-logo-slot img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.5)); }
        .island-brand {
            font-weight: 800; font-size: 0.95rem; color: #fff; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }
        .island-time {
            font-size: 0.9rem; font-weight: 700; color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 8px var(--primary-accent);
        }

        #taskbar {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--aero-glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--aero-glass-border); padding: 10px 18px; border-radius: var(--radius-panels);
            display: flex; gap: 14px; z-index: 99999; box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65), inset 0 1px 3px rgba(255, 255, 255, 0.25);
            max-width: 95vw; transition: opacity 0.4s var(--apple-ease), transform 0.4s var(--apple-ease);
        }
        
        .taskbar-app {
            width: 50px; height: 50px; border-radius: 50%; background: transparent;
            display: flex; justify-content: center; align-items: center; position: relative;
            flex-shrink: 0; transition: transform 0.35s var(--apple-ease);
        }
        .custom-taskbar-icon {
            width: 100%; height: 100%; object-fit: contain; border-radius: 50%; flex-shrink: 0;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); transition: filter 0.2s ease, transform 0.2s ease;
        }
        .taskbar-app:hover { transform: translateY(-6px) scale(1.08); }
        .taskbar-app:hover .custom-taskbar-icon { filter: drop-shadow(0 0 16px currentColor); }
        
        .taskbar-app.active::after {
            content: ''; position: absolute; bottom: -8px;
            width: 20px; height: 3px; background: currentColor;
            border-radius: 2px; box-shadow: 0 0 10px currentColor;
            animation: indicatorPulse 1.8s ease-in-out infinite alternate;
        }
        @keyframes indicatorPulse { from { opacity: 0.7; transform: scaleX(0.8); } to { opacity: 1; transform: scaleX(1.1); box-shadow: 0 0 14px currentColor; } }

        .taskbar-app.minimized::after {
            content: ''; position: absolute; bottom: -8px;
            width: 6px; height: 3px; background: currentColor;
            border-radius: 2px; opacity: 0.6;
        }

        .taskbar-app.app-binary { color: var(--binary-blitz-accent); }
        .taskbar-app.app-canvas { color: var(--canvas-clash-accent); }
        .taskbar-app.app-scene { color: var(--scene-sync-accent); }
        .taskbar-app.app-capital { color: var(--capital-core-accent); }
        .taskbar-app.app-grey { color: var(--text-secondary); font-size: 1.5rem; }
        .taskbar-app.app-grey:hover i { filter: drop-shadow(0 0 16px currentColor); }

        /* Professional Apple Unboxing Transition Windows */
        .os-window {
            position: absolute; background: rgba(10, 14, 22, 0.88);
            backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--aero-glass-border); border-radius: var(--radius-main);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; overflow: hidden;
            opacity: 0; transform: translate3d(0, 18px, 0) scale(0.95);
            transition: opacity 0.35s var(--apple-ease), transform 0.35s var(--apple-ease), width 0.3s var(--apple-ease), height 0.3s var(--apple-ease);
            touch-action: none; --app-theme: var(--primary-accent);
        }
        .os-window[data-app-id="binary_blitz"] { border-color: rgba(6, 182, 212, 0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(6, 182, 212, 0.18); }
        .os-window[data-app-id="canvas_clash"] { border-color: rgba(245, 158, 11, 0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(245, 158, 11, 0.18); }
        .os-window[data-app-id="scene_sync"] { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(239, 68, 68, 0.18); }
        .os-window[data-app-id="capital_core"] { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(16, 185, 129, 0.18); }
        .os-window[data-app-id="trailer"], 
        .os-window[data-app-id="credits"] { border-color: rgba(148, 163, 184, 0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.8), 0 0 35px rgba(148, 163, 184, 0.18); }

        .os-window.open { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        .os-window.minimized { opacity: 0 !important; transform: translate3d(0, 30px, 0) scale(0.9) !important; pointer-events: none !important; }

        .window-header {
            height: 46px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-bottom: 1px solid var(--aero-glass-border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
        }
        .window-title { font-size: 0.92rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
        .window-title img { width: 18px; height: 18px; object-fit: contain; border-radius: var(--radius-btn); }
        .window-controls { display: flex; align-items: center; gap: 8px; }
        .window-btn { width: 12px; height: 12px; border-radius: 50%; border: none; transition: transform 0.2s var(--apple-ease), filter 0.2s ease; }
        .window-btn:hover { transform: scale(1.2); filter: brightness(1.2); }
        .btn-minimize { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e; }
        .btn-maximize { background: #27c93f; box-shadow: 0 0 6px #27c93f; }
        .btn-close { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }

        .window-body { flex: 1; padding: 24px; overflow-y: auto; overflow-x: hidden; color: var(--text-primary); }
        .window-body::-webkit-scrollbar { width: 6px; }
        .window-body::-webkit-scrollbar-track { background: rgba(10, 15, 30, 0.5); border-radius: 8px; }
        .window-body::-webkit-scrollbar-thumb { background: var(--app-theme); border-radius: 8px; }

        .app-top-banner {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-panels); padding: 18px 22px; margin-bottom: 20px; gap: 20px; box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.06);
        }
        .compact-logo-mount { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
        
        .compact-logo-slot {
            width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent;
        }
        .compact-event-icon {
            width: 100%; height: 100%; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 16px currentColor);
            transition: transform 0.3s var(--apple-ease);
        }
        .compact-logo-slot:hover .compact-event-icon { transform: scale(1.06); }
        .compact-logo-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .compact-logo-title { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .compact-logo-sub { font-size: 0.82rem; color: var(--text-secondary); }
        
        .event-head-card {
            display: flex; flex-direction: column; align-items: flex-end; text-align: right;
            padding-left: 20px; border-left: 1px solid rgba(255, 255, 255, 0.12); flex-shrink: 0; gap: 4px; min-width: 180px;
        }
        .head-role-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-secondary); text-transform: uppercase; }
        .head-name { font-size: 1rem; font-weight: 700; color: #fff; margin-top: 2px; }
        .head-contact {
            font-size: 0.86rem; color: var(--text-secondary); display: flex; align-items: center; gap: 7px;
            margin-top: 2px; background: rgba(255, 255, 255, 0.04); padding: 4px 9px; border-radius: var(--radius-btn); border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .event-app-container { display: flex; flex-direction: column; gap: 16px; }
        .event-section { background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.08); padding: 16px 20px; border-radius: var(--radius-panels); transition: border-color 0.2s ease, transform 0.2s ease; }
        .event-section:hover { border-color: rgba(255, 255, 255, 0.18); transform: translateY(-1px); }
        .event-section h3 { font-size: 0.98rem; margin-bottom: 8px; display: flex; align-items: center; gap: 9px; }
        .event-section p, .event-section ul { font-size: 0.88rem; line-height: 1.55; color: var(--text-secondary); }
        .event-section ul { padding-left: 18px; }
        .event-actions { display: flex; gap: 12px; margin-top: 10px; }
        .reg-btn, .brochure-link-btn {
            flex: 1; padding: 13px 16px; border-radius: var(--radius-btn); text-decoration: none; text-align: center;
            font-weight: 700; font-size: 0.92rem; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
            border: none; transition: transform 0.25s var(--apple-ease), opacity 0.2s ease, box-shadow 0.25s ease;
        }
        .brochure-link-btn { background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); }
        .reg-btn:hover, .brochure-link-btn:hover { transform: translateY(-2px) scale(1.01); opacity: 0.95; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }

        #desktopContextMenu {
            position: fixed; background: var(--aero-glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--aero-glass-border);
            border-radius: var(--radius-panels); padding: 6px; width: 175px; z-index: 99999; display: none; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            animation: fadeInMenu 0.25s var(--apple-ease) forwards;
        }
        @keyframes fadeInMenu { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        #desktopContextMenu.visible { display: block; }
        .menu-item { padding: 8px 11px; font-size: 0.84rem; color: var(--text-primary); border-radius: var(--radius-btn); display: flex; align-items: center; gap: 9px; transition: background 0.15s ease; }
        .menu-item:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        /* Smooth Apple Modal Popup */
        #judgingPopup {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.65); z-index: 1000000;
            display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; 
            transition: opacity 0.35s var(--apple-ease), visibility 0.35s var(--apple-ease);
        }
        #judgingPopup.show { opacity: 1; visibility: visible; }
        .popup-card {
            background: var(--aero-glass-bg); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border: 1px solid var(--aero-glass-border);
            border-radius: var(--radius-panels); padding: 32px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
            transform: scale(0.92) translateY(10px); transition: transform 0.35s var(--apple-ease);
        }
        #judgingPopup.show .popup-card { transform: scale(1) translateY(0); }
        .popup-icon { font-size: 2.8rem; color: var(--text-secondary); margin-bottom: 14px; filter: drop-shadow(0 0 12px var(--text-secondary)); }
        .popup-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .popup-text { font-size: 0.86rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }

        /* Optimized Trailer Container with Native Video & Cursor Fix Overlay */
        .trailer-container {
            position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--radius-panels);
            background: #000; margin-top: 14px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
        }
        .trailer-container video {
            width: 100%; height: 100%; object-fit: cover; display: block; border-radius: var(--radius-panels);
        }
        .video-cursor-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 5;
        }

        @media (max-width: 1100px) { .wallpaper-logo-mount { display: none; } }
        @media (max-width: 768px) {
            #dynamicIsland { width: 92vw; height: 54px; padding: 0 14px; }
            .os-window { width: 96vw !important; height: calc(100dvh - 130px) !important; left: 2vw !important; top: 65px !important; }
            .event-actions { flex-direction: column; }
            .reg-btn, .brochure-link-btn { width: 100%; }
            #taskbar { width: 96vw; padding: 8px; bottom: 15px; overflow-x: auto; }
            #taskbar::-webkit-scrollbar { display: none; }
            .app-top-banner { flex-direction: column; align-items: flex-start; padding: 15px; }
            .event-head-card { align-items: flex-start; text-align: left; padding-left: 0; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 10px; width: 100%; }
        }
    </style>
</head>
<body class="booting">

    <div id="customCursor"></div>
    <div id="customCursorDot"></div>

    <div id="bootScreen">
        <div class="boot-spinner"></div>
        <div class="boot-title">STARTING INNOVATEX OS</div>
    </div>

    <canvas id="wallpaperCanvas"></canvas>

    <div id="workspace">
        
        <div class="wallpaper-logo-mount left" id="schoolLogoMount">
            <div class="logo-slot">
                <img id="schoolLogoImg" src="HIS.png" alt="School Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="fa-solid fa-school" style="display:none;"></i>
            </div>
            <div class="logo-label" id="schoolLogoLabel">Harvest International School</div>
            <div class="logo-subtext">Innovation Campus</div>
        </div>

        <div class="wallpaper-logo-mount right" id="festLogoMount">
            <div class="logo-slot">
                <img id="festLogoImg" src="Logo.png" alt="InnovateX Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <i class="fa-solid fa-rocket" style="display:none;"></i>
            </div>
            <div class="logo-label" id="festLogoLabel">InnovateX</div>
            <div class="logo-subtext">Inter School Event</div>
        </div>

        <div id="dynamicIsland">
            <div class="island-section">
                <div class="island-logo-slot">
                    <img id="islandLogoImg" src="Logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="fa-solid fa-rocket" style="display:none;"></i>
                </div>
                <div class="island-brand" id="islandBrandText">InnovateX</div>
            </div>

        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);

        if (!isTouchDevice) {

                mousePos.x = e.clientX; mousePos.y = e.clientY;
                cursorDot.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            });

            function animateCursor() {
                cursorCoords.x += (mousePos.x - cursorCoords.x) * 0.55;
                cursorCoords.y += (mousePos.y - cursorCoords.y) * 0.55;
                cursor.style.transform = `translate3d(${cursorCoords.x}px, ${cursorCoords.y}px, 0) translate(-50%, -50%)`;

            }
            animateCursor();

            document.addEventListener('mouseover', (e) => {
                if (e.target.closest('button, a, .taskbar-app, .window-btn, .menu-item, .reg-btn, .brochure-link-btn')) document.body.classList.add('cursor-hover');

        window.addEventListener('load', () => {
            document.getElementById('schoolLogoImg').src = OS_CONFIG.schoolLogo.imgUrl;
            document.getElementById('schoolLogoLabel').textContent = OS_CONFIG.schoolLogo.label;
            document.getElementById('festLogoImg').src = OS_CONFIG.festLogo.imgUrl;

            document.getElementById('islandBrandText').textContent = OS_CONFIG.festLogo.title;

            const judgingBtn = document.getElementById('judgingTaskbarBtn');
            if (judgingBtn) {

            setTimeout(() => {
                const bootScreen = document.getElementById('bootScreen');
                if (bootScreen) bootScreen.classList.add('fade-out');
                document.body.classList.remove('booting');

        function showPopup() { document.getElementById('judgingPopup').classList.add('show'); }
        function hidePopup() { document.getElementById('judgingPopup').classList.remove('show'); }

        const canvas = document.getElementById('wallpaperCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let particles = [];
        const mouse = { x: null, y: null, radius: 135 };

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('click', (e) => {
            if (particles.length > 200) particles.splice(0, 8); 
            for (let i = 0; i < 8; i++) particles.push(new Particle(e.clientX, e.clientY, true));
        });

        class Particle {
            constructor(x, y, isBurst = false) { this.reset(x, y, isBurst); }
            reset(x, y, isBurst) {
                if (!canvas) return;
                this.x = x !== undefined ? x : Math.random() * canvas.width;
                this.y = y !== undefined ? y : Math.random() * canvas.height;
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3.5 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    this.vx = (Math.random() - 0.5) * 0.7;
                    this.vy = (Math.random() - 0.5) * 0.7;
                }
                this.radius = Math.random() * 2 + 1;
                const colors = ['rgba(6, 182, 212, 0.6)', 'rgba(239, 68, 68, 0.5)', 'rgba(245, 158, 11, 0.45)', 'rgba(16, 185, 129, 0.4)'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = isBurst ? 90 : null;
            }
            update() {
                if (!canvas) return;
                this.x += this.vx; this.y += this.vy;
                if (this.life !== null) { this.life--; if (this.life <= 0) this.reset(); }
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 1.2;
                        this.y -= (dy / dist) * force * 1.2;
                    }
                }
            }
            draw() {
                if (!ctx) return;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
            }
        }

        for (let i = 0; i < (window.innerWidth < 768 ? 40 : 70); i++) particles.push(new Particle());

        function animateWallpaper() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(6, 182, 212, ${0.14 * (1 - dist / 110)})`; ctx.lineWidth = 1; ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animateWallpaper);
        }
        animateWallpaper();

        setInterval(() => {
            const clockEl = document.getElementById('islandClock');
            if (clockEl) clockEl.textContent = new Date().toLocaleTimeString();

        window.addEventListener('contextmenu', (e) => {

                        <h3 style="color:${config.accentColor};"><i class="fa-solid fa-layer-group"></i> Key Categories / Divisions</h3>
                        <ul>${config.categories.map(c => `<li>${c}</li>`).join('')}</ul>
                    </section>
                    <section class="event-section">
                        <h3 style="color:${config.accentColor};"><i class="fa-solid fa-bolt"></i> Sample Zero-Day Briefs</h3>
                        <ul>${config.samples.map(s => `<li>${s}</li>`).join('')}</ul>
                    </section>
                    <div class="event-actions">
                        <button onclick="window.open('${config.pdfUrl}', '_blank')" class="brochure-link-btn">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> View Domain PDF
                        </button>
                        <a href="${config.registerUrl}" target="_blank" class="reg-btn" style="background:${config.accentColor}; color:#fff;">
                            <i class="fa-solid fa-pen-to-square"></i> Track Registration
                        </a>
                    </div>
                </div>
            `;
        }

        const appData = {
            binary_blitz: OS_CONFIG.events.binary_blitz,
            canvas_clash: OS_CONFIG.events.canvas_clash,
            scene_sync: OS_CONFIG.events.scene_sync,
            capital_core: OS_CONFIG.events.capital_core,
            trailer: {
                title: "Trailer & Master Brochure",
                windowTitleIcon: "MT.png",
                iconFallback: "fa-film",
                accentColor: "var(--text-secondary)",
                content: `
                    <div class="event-section">
                        <h3 style="color:var(--text-secondary); display:flex; justify-content:center;">
                            <i class="fa-solid fa-video"></i> Official InnovateX Trailer

            },
            credits: {

                accentColor: "var(--text-secondary)",
                content: `
                    <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding: 10px;">
                        <img src="Logo.png" style="width: 90px; height: 90px; margin-bottom: 18px; filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.4));">
                        
                        <h2 style="font-size: 1.7rem; margin-bottom: 4px; color: #fff;">InnovateX OS</h2>
                        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 22px; letter-spacing: 1px;">Version 26.21 (OS Build 2026.1304)</p>
                        
                        <div style="text-align: left; background: rgba(255,255,255,0.03); padding: 20px; border-radius: var(--radius-panels); border: 1px solid rgba(255,255,255,0.07); width: 100%; font-size: 0.86rem; color: var(--text-secondary); line-height: 1.55; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);">
                            <p style="color: #fff; font-weight: 600; margin-bottom: 10px;">InnovateX Operating System<br>&copy; 2026 Alliance Group. All rights reserved.</p>
                            
                            <p style="margin-bottom: 14px;">The InnovateX Operating System and its user interface are protected by trademark and other pending or existing intellectual property rights globally.</p>
                            
                            <p style="margin-bottom: 14px;">Engineered by Alliance Group.</p>

                    </div>
                `
            }
        };

        let activeWindows = {}; let windowStates = {}; let highestZIndex = 100;

        function toggleApp(appId) {
            if (activeWindows[appId]) {
                if (windowStates[appId] === 'minimized') restoreApp(appId);
                else if (getTopWindow(appId)) minimizeApp(appId);
                else bringToFront(activeWindows[appId]);
            } else { openApp(appId); }
        }

        function getTopWindow(appId) { const win = activeWindows[appId]; return win && parseInt(win.style.zIndex || 0, 10) === highestZIndex; }

        function openApp(appId) {
            const data = appData[appId];
            if (!data) return;

            const isMobile = window.innerWidth <= 768;
            const win = document.createElement('div');
            win.className = 'os-window';
            win.dataset.appId = appId;
            win.style.setProperty('--app-theme', data.accentColor || 'var(--primary-accent)');
            
            const defaultHeight = Math.min(600, window.innerHeight - 180);
            const defaultWidth = Math.min(820, window.innerWidth - 60);
            win.style.width = `${defaultWidth}px`;
            win.style.height = `${defaultHeight}px`;

            if (!isMobile) {
                const offset = (Object.keys(activeWindows).length % 4) * 18;
                win.style.top = `${90 + offset}px`;
                win.style.left = `${Math.max(30, (window.innerWidth - defaultWidth) / 2 + offset)}px`;
            }

            const winContent = data.content ? data.content : createCoreAppContent(data);
            const titleIconHtml = data.windowTitleIcon 
                ? `<img src="${data.windowTitleIcon}" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><i class="fa-solid ${data.iconFallback}" style="display:none; ${data.accentColor ? 'color:' + data.accentColor : ''}"></i>`
                : `<i class="fa-solid ${data.iconFallback}" style="${data.accentColor ? 'color:' + data.accentColor : ''}"></i>`;

            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title">${titleIconHtml} ${data.title}</div>
                    <div class="window-controls">
                        <button class="window-btn btn-minimize"></button>
                        <button class="window-btn btn-maximize"></button>
                        <button class="window-btn btn-close"></button>
                    </div>
                </div>
                <div class="window-body">${winContent}</div>
            `;

            win.querySelector('.btn-minimize').addEventListener('click', (e) => { e.stopPropagation(); minimizeApp(appId); });
            win.querySelector('.btn-maximize').addEventListener('click', (e) => { e.stopPropagation(); toggleMaximizeWindow(appId); });
            win.querySelector('.btn-close').addEventListener('click', (e) => { e.stopPropagation(); closeApp(appId); });

            const header = win.querySelector('.window-header');
            header.addEventListener('mousedown', (e) => initDrag(e, win));
            header.addEventListener('touchstart', (e) => initDrag(e, win), { passive: false });
            win.addEventListener('mousedown', () => bringToFront(win));
            win.addEventListener('touchstart', () => bringToFront(win), { passive: true });

            document.getElementById('workspace').appendChild(win);
            activeWindows[appId] = win; windowStates[appId] = 'open';
            requestAnimationFrame(() => win.classList.add('open'));
            updateTaskbarState(appId, 'open');
            bringToFront(win);
        }

        function minimizeApp(appId) {
            const win = activeWindows[appId]; if (!win) return;
            win.classList.add('minimized'); windowStates[appId] = 'minimized'; updateTaskbarState(appId, 'minimized');
        }

        function restoreApp(appId) {
            const win = activeWindows[appId]; if (!win) return;
            win.classList.remove('minimized'); windowStates[appId] = 'open'; updateTaskbarState(appId, 'open'); bringToFront(win);
        }

        function closeApp(appId) {
            const win = activeWindows[appId]; if (!win) return;
            if (win.dataset.maximized === "true") restoreWindowDimensions(win);
            win.classList.remove('open');
            document.body.classList.remove('cursor-hover');

            setTimeout(() => { 
                win.remove(); 
                delete activeWindows[appId]; 
                delete windowStates[appId]; 
                updateTaskbarState(appId, 'closed'); 
            }, 300);
        }

        function bringToFront(win) { highestZIndex++; win.style.zIndex = highestZIndex; }

        function updateTaskbarState(appId, state) {
            const taskbarApps = document.querySelectorAll('#taskbarAppsContainer .taskbar-app');
            const indexMap = { binary_blitz: 0, canvas_clash: 1, scene_sync: 2, capital_core: 3, trailer: 4, credits: 5 };
            const idx = indexMap[appId];
            
            if (idx !== undefined && taskbarApps[idx]) {
                const appBtn = taskbarApps[idx];
                if (state === 'open') {
                    appBtn.classList.add('active');
                    appBtn.classList.remove('minimized');
                } else if (state === 'minimized') {
                    appBtn.classList.remove('active');
                    appBtn.classList.add('minimized');
                } else if (state === 'closed') {
                    appBtn.classList.remove('active', 'minimized');
                }
            }
        }

        function initDrag(e, win) {
            if (e.target.closest('.window-controls') || win.dataset.maximized === "true" || window.innerWidth <= 768) return;
            bringToFront(win);
            let isTouch = e.type === 'touchstart';
            let startX = isTouch ? e.touches[0].clientX : e.clientX;
            let startY = isTouch ? e.touches[0].clientY : e.clientY;
            let rect = win.getBoundingClientRect();
            let offsetX = startX - rect.left;
            let offsetY = startY - rect.top;

            function onMove(moveEvent) {
                let currentX = moveEvent.type.startsWith('touch') ? moveEvent.touches[0].clientX : moveEvent.clientX;
                let currentY = moveEvent.type.startsWith('touch') ? moveEvent.touches[0].clientY : moveEvent.clientY;
                win.style.left = `${currentX - offsetX}px`; win.style.top = `${currentY - offsetY}px`;
            }
            function onEnd() {
                window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onEnd);
                window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onEnd);
            }
            if (isTouch) { window.addEventListener('touchmove', onMove, { passive: false }); window.addEventListener('touchend', onEnd); } 
            else { window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd); }
        }

        function toggleMaximizeWindow(appId) {
            const win = activeWindows[appId]; if (!win) return;
            if (win.dataset.maximized === "true") restoreWindowDimensions(win); else maximizeWindowDimensions(win);
        }

        function maximizeWindowDimensions(win) {
            win.dataset.prevTop = win.style.top || "90px"; win.dataset.prevLeft = win.style.left || "100px";
            win.dataset.prevWidth = win.style.width || "820px"; win.dataset.prevHeight = win.style.height || "600px";
            win.style.top = "0px"; win.style.left = "0px"; win.style.width = "100vw";
            const isMobile = window.innerWidth <= 768;
            win.style.height = isMobile ? "calc(100dvh - 75px)" : "100dvh"; win.style.borderRadius = isMobile ? "var(--radius-panels)" : "0px";
            win.dataset.maximized = "true"; bringToFront(win);
            if (!isMobile) { document.getElementById('taskbar').style.opacity = '0'; document.getElementById('taskbar').style.pointerEvents = 'none'; }
            document.getElementById('dynamicIsland').style.opacity = '0'; document.getElementById('dynamicIsland').style.pointerEvents = 'none';
        }

        function restoreWindowDimensions(win) {
            win.style.width = win.dataset.prevWidth || "820px"; win.style.height = win.dataset.prevHeight || "600px";
            win.style.top = win.dataset.prevTop || "90px"; win.style.left = win.dataset.prevLeft || "100px";
            win.style.borderRadius = "var(--radius-main)"; win.dataset.maximized = "false";
            document.getElementById('taskbar').style.opacity = '1'; document.getElementById('taskbar').style.pointerEvents = 'auto';
            document.getElementById('dynamicIsland').style.opacity = '1'; document.getElementById('dynamicIsland').style.pointerEvents = 'auto';
        }
    </script>
</body>
</html>
