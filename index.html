<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvest InnovateX OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #040609;
            --aero-glass-bg: rgba(14, 18, 28, 0.72);
            --aero-glass-surface: rgba(255, 255, 255, 0.05);
            --aero-glass-border: rgba(6, 182, 212, 0.3);
            --aero-glass-shine: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(6, 182, 212, 0) 100%);
            
            /* Cyan to Red Core Palette */
            --primary-accent: #06b6d4;   /* Cyan */
            --secondary-accent: #ef4444; /* Red */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --radius-main: 20px;
            --radius-btn: 12px;

            /* Event App Theme Colors */
            --binary-blitz-accent: #06b6d4;  /* Cyan */
            --canvas-clash-accent: #f59e0b;  /* Yellow */
            --scene-sync-accent: #ef4444;    /* Red */
            --capital-core-accent: #10b981;  /* Emerald */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Professional Minimalist Custom Cursor */
        body, html {
            cursor: none !important;
        }
        button, a, .taskbar-app, .window-btn, .menu-item, .reg-btn, .brochure-link-btn, input, select {
            cursor: none !important;
        }

        #customCursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border: 1.5px solid rgba(6, 182, 212, 0.85);
            background: rgba(6, 182, 212, 0.04);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
            z-index: 9999999;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.25);
        }
        #customCursorDot {
            position: fixed;
            top: 0;
            left: 0;
            width: 5px;
            height: 5px;
            background: var(--secondary-accent);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10000000;
            box-shadow: 0 0 8px var(--secondary-accent);
        }
        body.cursor-hover #customCursor {
            width: 38px;
            height: 38px;
            border-color: var(--secondary-accent);
            background: rgba(239, 68, 68, 0.08);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 15, 30, 0.5);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-accent);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-accent);
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }

        #bootScreen {
            position: fixed;
            inset: 0;
            background: #020305;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #bootScreen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .boot-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top-color: var(--primary-accent);
            border-right-color: var(--secondary-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .boot-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 0 15px var(--primary-accent);
        }

        #wallpaperCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
        }

        #workspace {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }
        #workspace > * {
            pointer-events: auto;
        }

        .wallpaper-logo-mount {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 210px;
            height: 280px;
            background: var(--aero-glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--aero-glass-border);
            border-radius: 24px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }
        .wallpaper-logo-mount::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: var(--aero-glass-shine);
            pointer-events: none;
        }
        .wallpaper-logo-mount.left { left: 35px; }
        .wallpaper-logo-mount.right { right: 35px; }

        .logo-slot {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(6, 182, 212, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
            position: relative;
            overflow: hidden;
        }
        .logo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-slot i {
            font-size: 2rem;
            color: var(--primary-accent);
            text-shadow: 0 0 12px var(--primary-accent);
        }
        .logo-label {
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
            text-align: center;
        }
        .logo-subtext {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
            text-align: center;
        }

        /* Dynamic Island */
        #dynamicIsland {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 60px;
            background: var(--aero-glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--aero-glass-border);
            border-radius: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }
        #dynamicIsland::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 34px;
            background: var(--aero-glass-shine);
            pointer-events: none;
        }
        .island-section {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }
        .island-logo-slot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .island-logo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .island-logo-slot i {
            font-size: 1rem;
            color: var(--primary-accent);
        }
        .island-brand {
            font-weight: 800;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }
        .island-time {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 8px var(--primary-accent);
        }

        #taskbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--aero-glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--aero-glass-border);
            padding: 10px 16px;
            border-radius: 26px;
            display: flex;
            gap: 12px;
            z-index: 99999;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            max-width: 95vw;
        }
        .taskbar-app {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .custom-taskbar-icon {
            width: 58%;
            height: 58%;
            object-fit: contain;
        }
        .taskbar-app.app-binary { color: var(--binary-blitz-accent); }
        .taskbar-app.app-canvas { color: var(--canvas-clash-accent); }
        .taskbar-app.app-scene { color: var(--scene-sync-accent); }
        .taskbar-app.app-capital { color: var(--capital-core-accent); }
        .taskbar-app.app-grey { color: var(--text-secondary); font-size: 1.2rem; }

        .taskbar-app:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px currentColor;
        }
        .taskbar-app.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 14px;
            height: 3px;
            background: currentColor;
            border-radius: 2px;
            box-shadow: 0 0 8px currentColor;
        }

        .os-window {
            position: absolute;
            background: rgba(10, 14, 22, 0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--aero-glass-border);
            border-radius: var(--radius-main);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 0, 0) scale(0.95);
            transition: opacity 0.18s ease-out, transform 0.18s ease-out;
            touch-action: none;
        }
        .os-window[data-app-id="binary_blitz"] { border-color: rgba(6, 182, 212, 0.45); box-shadow: 0 25px 60px rgba(0,0,0,0.75), 0 0 25px rgba(6, 182, 212, 0.15); }
        .os-window[data-app-id="canvas_clash"] { border-color: rgba(245, 158, 11, 0.45); box-shadow: 0 25px 60px rgba(0,0,0,0.75), 0 0 25px rgba(245, 158, 11, 0.15); }
        .os-window[data-app-id="scene_sync"] { border-color: rgba(239, 68, 68, 0.45); box-shadow: 0 25px 60px rgba(0,0,0,0.75), 0 0 25px rgba(239, 68, 68, 0.15); }
        .os-window[data-app-id="capital_core"] { border-color: rgba(16, 185, 129, 0.45); box-shadow: 0 25px 60px rgba(0,0,0,0.75), 0 0 25px rgba(16, 185, 129, 0.15); }

        .os-window.open { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        .os-window.minimized {
            opacity: 0 !important;
            transform: translate3d(0, 30px, 0) scale(0.9) !important;
            pointer-events: none !important;
        }

        .window-header {
            height: 48px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-bottom: 1px solid var(--aero-glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            cursor: move;
        }
        .window-title {
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .window-title img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
        }
        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-btn {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: none;
            transition: transform 0.15s ease;
        }
        .window-btn:hover { transform: scale(1.2); }
        .btn-minimize { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e; }
        .btn-maximize { background: #27c93f; box-shadow: 0 0 6px #27c93f; }
        .btn-close { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }

        .window-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        /* Event Header & Contact Info */
        .app-top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px 24px;
            margin-bottom: 22px;
            gap: 24px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.06);
        }
        .compact-logo-mount {
            display: flex;
            align-items: center;
            gap: 18px;
            flex: 1;
            min-width: 0;
        }
        .compact-logo-slot {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px currentColor;
            overflow: hidden;
            flex-shrink: 0;
        }
        .compact-event-icon {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }
        .compact-logo-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        .compact-logo-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .compact-logo-sub {
            font-size: 0.84rem;
            color: var(--text-secondary);
        }
        
        .event-head-card {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding-left: 24px;
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            gap: 5px;
            min-width: 190px;
        }
        .head-role-label {
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .head-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }
        .head-contact {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            background: rgba(255, 255, 255, 0.04);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .event-app-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .event-section {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 22px;
            border-radius: 14px;
        }
        .event-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .event-section p, .event-section ul {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .event-section ul { padding-left: 20px; }
        .event-actions {
            display: flex;
            gap: 14px;
            margin-top: 12px;
        }
        .reg-btn, .brochure-link-btn {
            flex: 1;
            padding: 14px 18px;
            border-radius: var(--radius-btn);
            text-decoration: none;
            text-align: center;
            font-weight: 700;
            font-size: 0.94rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }
        .brochure-link-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .reg-btn:hover, .brochure-link-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        #desktopContextMenu {
            position: fixed;
            background: var(--aero-glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--aero-glass-border);
            border-radius: 12px;
            padding: 6px;
            width: 180px;
            z-index: 99999;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        #desktopContextMenu.visible { display: block; }
        .menu-item {
            padding: 9px 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        #judgingPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #judgingPopup.show { opacity: 1; visibility: visible; }
        .popup-card {
            background: var(--aero-glass-bg);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--aero-glass-border);
            border-radius: 24px;
            padding: 34px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #judgingPopup.show .popup-card { transform: scale(1); }
        .popup-icon {
            font-size: 3rem;
            color: var(--primary-accent);
            margin-bottom: 16px;
            text-shadow: 0 0 18px var(--primary-accent);
        }
        .popup-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
        .popup-text { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 22px; line-height: 1.55; }

        #notificationContainer {
            position: fixed;
            top: 85px;
            right: 22px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .notification-toast {
            background: var(--aero-glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--aero-glass-border);
            border-left: 4px solid var(--primary-accent);
            padding: 12px 16px;
            border-radius: 10px;
            min-width: 240px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        .pdf-embed-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pdf-embed-frame {
            width: 100%;
            height: calc(100% - 36px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 1100px) {
            .wallpaper-logo-mount { display: none; }
        }
        @media (max-width: 768px) {
            #dynamicIsland { width: 92vw; height: 56px; padding: 0 14px; }
            .os-window {
                width: 96vw !important;
                height: calc(100vh - 140px) !important;
                left: 2vw !important;
                top: 70px !important;
            }
            .event-actions { flex-direction: column; }
            .reg-btn, .brochure-link-btn { width: 100%; }
            #taskbar { width: 96vw; padding: 8px; bottom: 12px; overflow-x: auto; }
            #taskbar::-webkit-scrollbar { display: none; }
            .app-top-banner {
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
            }
            .event-head-card {
                align-items: flex-start;
                text-align: left;
                padding-left: 0;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.12);
                padding-top: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Custom Cursor Elements -->
    <div id="customCursor"></div>
    <div id="customCursorDot"></div>

    <div id="bootScreen">
        <div class="boot-spinner"></div>
        <div class="boot-title">STARTING INNOVATEX OS</div>
    </div>

    <!-- Interactable Canvas Wallpaper -->
    <canvas id="wallpaperCanvas"></canvas>

    <div id="workspace">
        
        <!-- School Logo Mount -->
        <div class="wallpaper-logo-mount left" id="schoolLogoMount">
            <div class="logo-slot">
                <img id="schoolLogoImg" src="HIS.png" alt="School Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <i class="fa-solid fa-school" style="display:none;"></i>
            </div>
            <div class="logo-label" id="schoolLogoLabel">Harvest International School</div>
            <div class="logo-subtext">Innovation Campus</div>
        </div>

        /* Custom Cursor Movement Logic */

        /* Interactable Canvas Wallpaper */
        const canvas = document.getElementById('wallpaperCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let particles = [];
        const mouse = { x: null, y: null, radius: 130 };

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(e.clientX, e.clientY, true));
            }
        });

        class Particle {
            constructor(x, y, isBurst = false) {
                this.reset(x, y, isBurst);
            }
            reset(x, y, isBurst) {
                if (!canvas) return;
                this.x = x !== undefined ? x : Math.random() * canvas.width;
                this.y = y !== undefined ? y : Math.random() * canvas.height;
                
                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                }
                
                this.radius = Math.random() * 2 + 1;
                const colors = ['rgba(6, 182, 212, 0.65)', 'rgba(245, 158, 11, 0.55)', 'rgba(239, 68, 68, 0.5)', 'rgba(16, 185, 129, 0.45)'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = isBurst ? 100 : null;
            }
            update() {
                if (!canvas) return;
                this.x += this.vx;
                this.y += this.vy;

                if (this.life !== null) {
                    this.life--;
                    if (this.life <= 0) this.reset();
                }

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        this.x -= (dx / dist) * force * 1.5;
                        this.y -= (dy / dist) * force * 1.5;
                    }
                }
            }
            draw() {
                if (!ctx) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        const particleCount = window.innerWidth < 768 ? 40 : 75;
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animateWallpaper() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    for (let j = i + 1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(6, 182, 212, ${0.15 * (1 - dist / 110)})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                if (mouse.x !== null && mouse.y !== null) {
                    for (let i = 0; i < particles.length; i++) {
                        let dx = mouse.x - particles[i].x;
                        let dy = mouse.y - particles[i].y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(mouse.x, mouse.y);
                            ctx.lineTo(particles[i].x, particles[i].y);
                            ctx.strokeStyle = `rgba(239, 68, 68, ${0.2 * (1 - dist / 130)})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animateWallpaper);
        }
        animateWallpaper();

        function updateClock() {

        function openBrochurePDF(pdfUrl) {
            if (!activeWindows['brochure']) {

        let activeWindows = {};
        let windowStates = {}; 
        let highestZIndex = 100;

        function toggleApp(appId) {
            if (activeWindows[appId]) {
                if (windowStates[appId] === 'minimized') {
                    restoreApp(appId);
                } else if (getTopWindow(appId)) {
                    minimizeApp(appId);
                } else {
                    bringToFront(activeWindows[appId]);
                }
            } else {
                openApp(appId);
            }
        }

        function getTopWindow(appId) {
            const win = activeWindows[appId];
            return win && parseInt(win.style.zIndex || 0, 10) === highestZIndex;
        }

        function openApp(appId) {
            const data = appData[appId];
            if (!data) return;

            const isMobile = window.innerWidth <= 768;
            const win = document.createElement('div');
            win.className = 'os-window';
            win.dataset.appId = appId;
            
            // Safe window bounding calculation to prevent crossing Dynamic Island & Taskbar
            const safeTopMargin = 95;
            const safeBottomMargin = 100;
            const maxAllowedHeight = window.innerHeight - (safeTopMargin + safeBottomMargin);
            const defaultHeight = Math.min(580, maxAllowedHeight);
            const defaultWidth = Math.min(840, window.innerWidth - 60);

            win.style.width = `${defaultWidth}px`;
            win.style.height = `${defaultHeight}px`;

            if (!isMobile) {
                const offset = (Object.keys(activeWindows).length % 4) * 18;
                const startTop = safeTopMargin + offset;
                const startLeft = Math.max(30, (window.innerWidth - defaultWidth) / 2 + offset);
                win.style.top = `${startTop}px`;
                win.style.left = `${startLeft}px`;
            }

            const winContent = data.content ? data.content : createCoreAppContent(data);
            const titleIconHtml = data.windowTitleIcon 
                ? `<img src="${data.windowTitleIcon}" alt="Icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"><i class="fa-solid ${data.iconFallback}" style="display:none; ${data.accentColor ? 'color:' + data.accentColor : ''}"></i>`
                : `<i class="fa-solid ${data.iconFallback}" style="${data.accentColor ? 'color:' + data.accentColor : ''}"></i>`;

            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title">
                        ${titleIconHtml} ${data.title}
                    </div>
                    <div class="window-controls">
                        <button class="window-btn btn-minimize" title="Minimize"></button>
                        <button class="window-btn btn-maximize" title="Maximize"></button>
                        <button class="window-btn btn-close" title="Close"></button>
                    </div>
                </div>
                <div class="window-body">${winContent}</div>
            `;

            const header = win.querySelector('.window-header');
            const minBtn = win.querySelector('.btn-minimize');
            const maxBtn = win.querySelector('.btn-maximize');
            const closeBtn = win.querySelector('.btn-close');

            minBtn.addEventListener('click', (e) => { e.stopPropagation(); minimizeApp(appId); });
            maxBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMaximizeWindow(appId); });
            closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeApp(appId); });

            header.addEventListener('mousedown', (e) => initDrag(e, win));
            header.addEventListener('touchstart', (e) => initDrag(e, win), { passive: false });

            win.addEventListener('mousedown', () => bringToFront(win));
            win.addEventListener('touchstart', () => bringToFront(win), { passive: true });

            document.getElementById('workspace').appendChild(win);
            activeWindows[appId] = win;
            windowStates[appId] = 'open';

            requestAnimationFrame(() => win.classList.add('open'));
            updateTaskbarState(appId, 'open');
            bringToFront(win);
        }

        function minimizeApp(appId) {
            const win = activeWindows[appId];
            if (!win) return;
            win.classList.add('minimized');
            windowStates[appId] = 'minimized';
            updateTaskbarState(appId, 'minimized');
        }

        function restoreApp(appId) {
            const win = activeWindows[appId];
            if (!win) return;
            win.classList.remove('minimized');
            windowStates[appId] = 'open';
            updateTaskbarState(appId, 'open');
            bringToFront(win);
        }

        function closeApp(appId) {
            const win = activeWindows[appId];
            if (!win) return;
            if (win.dataset.maximized === "true") restoreWindowDimensions(win);

            win.classList.remove('open');
            setTimeout(() => {
                win.remove();
                delete activeWindows[appId];
                delete windowStates[appId];
                updateTaskbarState(appId, 'closed');
            }, 180);
        }

        function bringToFront(win) {
            highestZIndex++;
            win.style.zIndex = highestZIndex;
        }

        function updateTaskbarState(appId, state) {
            const taskbarApps = document.querySelectorAll('#taskbarAppsContainer .taskbar-app');
            const indexMap = { binary_blitz: 0, canvas_clash: 1, scene_sync: 2, capital_core: 3, brochure: 4, credits: 5 };
            const idx = indexMap[appId];
            if (idx !== undefined && taskbarApps[idx]) {
                if (state === 'open') taskbarApps[idx].classList.add('active');
                else if (state === 'closed') taskbarApps[idx].classList.remove('active');
            }
        }

        function clearAllWindows() {
            Object.keys(activeWindows).forEach(appId => minimizeApp(appId));
            triggerNotification("Workspace", "All windows minimized.");
        }

        function initDrag(e, win) {
            if (e.target.closest('.window-controls')) return;
            if (win.dataset.maximized === "true" || window.innerWidth <= 768) return;

            bringToFront(win);

            let isTouch = e.type === 'touchstart';
            let startX = isTouch ? e.touches[0].clientX : e.clientX;
            let startY = isTouch ? e.touches[0].clientY : e.clientY;

            let rect = win.getBoundingClientRect();
            let offsetX = startX - rect.left;
            let offsetY = startY - rect.top;

            function onMove(moveEvent) {
                let currentX = moveEvent.type.startsWith('touch') ? moveEvent.touches[0].clientX : moveEvent.clientX;
                let currentY = moveEvent.type.startsWith('touch') ? moveEvent.touches[0].clientY : moveEvent.clientY;

                win.style.left = `${currentX - offsetX}px`;
                win.style.top = `${currentY - offsetY}px`;
            }

            function onEnd() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onEnd);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onEnd);
            }

            if (isTouch) {
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onEnd);
            } else {
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
            }
        }

        function toggleMaximizeWindow(appId) {
            const win = activeWindows[appId];
            if (!win) return;

            if (win.dataset.maximized === "true") restoreWindowDimensions(win);
            else maximizeWindowDimensions(win);
        }

        function maximizeWindowDimensions(win) {
            win.dataset.prevTop = win.style.top || "95px";
            win.dataset.prevLeft = win.style.left || "100px";
            win.dataset.prevWidth = win.style.width || "840px";
            win.dataset.prevHeight = win.style.height || "580px";

            win.style.top = "0px";
            win.style.left = "0px";
            win.style.width = "100vw";
            
            const isMobile = window.innerWidth <= 768;
            win.style.height = isMobile ? "calc(100vh - 80px)" : "100vh";
            win.style.borderRadius = isMobile ? "var(--radius-main)" : "0px";
            win.dataset.maximized = "true";
            
            bringToFront(win);
            
            if (!isMobile) {
                document.getElementById('taskbar').style.opacity = '0';
                document.getElementById('taskbar').style.pointerEvents = 'none';
            }
            document.getElementById('dynamicIsland').style.opacity = '0';
            document.getElementById('dynamicIsland').style.pointerEvents = 'none';
        }

        function restoreWindowDimensions(win) {
            win.style.width = win.dataset.prevWidth || "840px";
            win.style.height = win.dataset.prevHeight || "580px";
            win.style.top = win.dataset.prevTop || "95px";
            win.style.left = win.dataset.prevLeft || "100px";
            win.style.borderRadius = "var(--radius-main)";
            win.dataset.maximized = "false";

            document.getElementById('taskbar').style.opacity = '1';
            document.getElementById('taskbar').style.pointerEvents = 'auto';
            document.getElementById('dynamicIsland').style.opacity = '1';
            document.getElementById('dynamicIsland').style.pointerEvents = 'auto';
        }
    </script>
</body>
</html>
